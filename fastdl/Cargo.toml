[package]
name = "fastdl"
version = "0.1.0"
edition = "2021"
description = "高速分段并行下载器（macOS/通用）：Range 探测 → 分段 → N 线程并行 → 按偏移落盘 → 断点续传"

[lib]
name = "fastdl"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
