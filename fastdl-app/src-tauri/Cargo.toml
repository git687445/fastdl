[package]
name = "fastdl-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastdl_app_lib"
crate-type = ["lib", "staticlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastdl = { path = "../../fastdl" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
